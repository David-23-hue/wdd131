                    Salt Lake Temple
                    <small class="photo-credit"><a
                            href="https://commons.wikimedia.org/wiki/File:Salt_Lake_Temple,_Utah_-_Sept_2004.jpg"

                            rel="noreferrer">CC BY 2.5</a></small>
                </figcaption>
            </figure>
            <figure id="new">
                <img src="images/temples/rome.jpg" alt="The Rome Italy Temple" width="360"

                    Rome Italy Temple
                    <small class="photo-credit"><a href="https://commons.wikimedia.org/wiki/File:LDS_Rome_Temple_4.jpg"

                            href="https://commons.wikimedia.org/wiki/File:Suva_Fiji_Temple_by_bhaskarroo_cropped.jpg"
